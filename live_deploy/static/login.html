<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>live_deploy — Login</title>
<!-- Same PWA install tags as index.html (Step 70) -- kept consistent
     here too since an expired session can land a user back on this
     page even from inside the installed app. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B1130">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="live_deploy">
<script>
// Same flash-avoidance trick as static/index.html — if the user
// already chose a theme post-login, honor it here too, before the
// stylesheet below is parsed.
(function () {
  var saved = localStorage.getItem('theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
})();
</script>
<style>
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 700; font-display: swap;
    src: url('/fonts/plexsans-700-normal-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 700; font-display: swap;
    src: url('/fonts/plexsans-700-normal-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 400; font-display: swap;
    src: url('/fonts/plexsans-400-normal-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 400; font-display: swap;
    src: url('/fonts/plexsans-400-normal-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 600; font-display: swap;
    src: url('/fonts/plexsans-600-normal-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'IBM Plex Sans';
    font-style: normal; font-weight: 600; font-display: swap;
    src: url('/fonts/plexsans-600-normal-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root {
    --bg: #F6F1E4; --paper: #FFFDF6; --panel: #EFE4C8; --line: #2A1B45;
    --ink: #1B1130; --parchment: #6B5A72;
    --accent: #E2711D; --accent-soft: #F6C177; --accent-hover: #C65F13;
    --loss: #B23A48; --loss-soft: #F7E1E1;
    --shadow: 14px 14px 0 rgba(27, 17, 48, 0.16);
    --font-display: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }
  /* Same "ink and paper swapped" dark palette as static/index.html —
     see that file's :root for the full reasoning. Kept to just the
     tokens this page actually uses. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #150E22; --paper: #1E1533; --panel: #251A40; --line: #4C3D74;
      --ink: #F1E8DC; --parchment: #B8A8C9;
      --accent: #EB8A3D; --accent-soft: #8A5320; --accent-hover: #FF9950;
      --loss: #FF8B95; --loss-soft: #3D1B22;
      --shadow: 14px 14px 0 rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #150E22; --paper: #1E1533; --panel: #251A40; --line: #4C3D74;
    --ink: #F1E8DC; --parchment: #B8A8C9;
    --accent: #EB8A3D; --accent-soft: #8A5320; --accent-hover: #FF9950;
    --loss: #FF8B95; --loss-soft: #3D1B22;
    --shadow: 14px 14px 0 rgba(0, 0, 0, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); background: var(--bg); color: var(--ink);
    height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  .card {
    background: var(--paper); border: 3px solid var(--line); box-shadow: var(--shadow);
    padding: 34px 32px; width: 100%; max-width: 340px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .brand-mark {
    width: 38px; height: 38px; flex-shrink: 0; border: 3px solid var(--line); background: var(--accent-soft);
    color: var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 15px; font-family: var(--font-display);
  }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: var(--ink); }
  .sub { font-size: 10.5px; color: var(--parchment); margin-top: 3px; }
  label { display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--parchment); margin-bottom: 7px; }
  input {
    width: 100%; background: var(--paper); border: 3px solid var(--line); color: var(--ink);
    padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 16px; padding: 10px 14px; border: 3px solid var(--line);
    background: var(--accent); color: #fff; font-family: var(--font-body);
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 12px; font-weight: 600; min-height: 18px; }
  .msg.error { color: var(--loss); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">L</div>
    <div>
      <h1>live_deploy</h1>
      <div class="sub">This app's own login — unrelated to your Kite credentials.</div>
    </div>
  </div>
  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required style="margin-bottom: 14px;">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">Login</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  btn.disabled = true;
  msg.className = 'msg';
  msg.textContent = '';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (r.ok) {
      window.location.href = '/';
      return;
    }
    const data = await r.json().catch(() => ({}));
    msg.className = 'msg error';
    msg.textContent = data.detail || 'Login failed';
  } catch (err) {
    msg.className = 'msg error';
    msg.textContent = 'Server unreachable';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
