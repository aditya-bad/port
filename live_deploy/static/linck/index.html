<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linck</title>
<meta name="description" content="Live options deployments: the session, positions, leaderboards and reports.">
<meta name="theme-color" content="#f6f5f0">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/linck-32.png">
<link rel="apple-touch-icon" href="/icons/linck-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linck">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Apply saved appearance before first paint (mirrors js/core/prefs.js).
  (function () {
    var p = {};
    try { p = JSON.parse(localStorage.getItem('linck-prefs') || '{}') || {}; } catch (e) {}
    var r = document.documentElement, dark = false;
    try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    r.setAttribute('data-th', p.theme || (dark ? 'night' : 'paper'));
    r.setAttribute('data-pos', p.pos || 'green');
    r.setAttribute('data-hl', p.hl || 'yellow');
    r.setAttribute('data-ct', p.ct || 'std');
    r.setAttribute('data-size', p.size || 'std');
    r.setAttribute('data-font', p.font || 'linck');
    // The installed app always launches here (manifest start_url). If
    // classic was the last choice, honour it; classic's Try Linck sets
    // 'linck' before coming back, so switching still works both ways.
    try {
      var app = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      if (app && localStorage.getItem('uiExperience') === 'classic') { location.replace('/'); return; }
      localStorage.setItem('uiExperience', 'linck');
    } catch (e) {}
  })();
</script>
