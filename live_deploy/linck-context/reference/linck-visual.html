:root {
  --ink: oklch(0.2 0.01 90);
  --paper: oklch(0.968 0.006 90);
  --card: oklch(0.985 0.004 90);
  --soft: oklch(0.94 0.008 90);
  --line: oklch(0.86 0.01 90);
  --line2: oklch(0.76 0.01 90);
  --mute: oklch(0.48 0.01 90);
  --y: oklch(0.88 0.13 95);
  --ys: oklch(0.95 0.05 95);
  --g: oklch(0.5 0.14 150);
  --r: oklch(0.55 0.2 28);
  --b: oklch(0.6 0.13 250);
  --wt: oklch(0.5 0.17 40);
  --f-display: 'Funnel Display', 'Funnel Sans', system-ui, sans-serif;
  --f-body: 'Funnel Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: oklch(0.93 0.008 85); --paper: oklch(0.19 0.008 75); --card: oklch(0.22 0.008 75); --soft: oklch(0.255 0.01 75);
    --line: oklch(0.32 0.01 75); --line2: oklch(0.42 0.01 75); --mute: oklch(0.7 0.01 85); --y: oklch(0.45 0.1 85); --ys: oklch(0.28 0.05 85);
    --g: oklch(0.76 0.15 150); --r: oklch(0.72 0.17 28); --b: oklch(0.74 0.11 250); --wt: oklch(0.8 0.14 65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: oklch(0.93 0.008 85); --paper: oklch(0.19 0.008 75); --card: oklch(0.22 0.008 75); --soft: oklch(0.255 0.01 75);
  --line: oklch(0.32 0.01 75); --line2: oklch(0.42 0.01 75); --mute: oklch(0.7 0.01 85); --y: oklch(0.45 0.1 85); --ys: oklch(0.28 0.05 85);
  --g: oklch(0.76 0.15 150); --r: oklch(0.72 0.17 28); --b: oklch(0.74 0.11 250); --wt: oklch(0.8 0.14 65);
  color-scheme: dark;
}



:root { --pu: oklch(0.52 0.16 305); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pu: oklch(0.74 0.12 305); } }
:root[data-theme="dark"] { --pu: oklch(0.74 0.12 305); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body); overflow: hidden; }
#stage { display: block; width: 100vw; height: 100vh; }
button:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }

nav.ctl { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; background: var(--card); border: 1px solid var(--line2); opacity: .35; transition: opacity .2s; }
nav.ctl:hover, nav.ctl:focus-within { opacity: 1; }
nav.ctl > button { font: 600 13px/1 var(--f-mono); color: var(--ink); background: none; border: 1px solid var(--line2); width: 34px; height: 30px; cursor: pointer; }
nav.ctl > button:hover { background: var(--soft); }
.dots { display: flex; gap: 5px; }
.dots button { width: 11px; height: 11px; padding: 0; border: 1.5px solid var(--ink); background: none; cursor: pointer; }
.dots button.on { background: var(--ink); }
body.record nav.ctl { display: none; }
.turn { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  .turn { display: flex; position: fixed; inset: auto 16px 70px 16px; justify-content: center; gap: 10px; align-items: center;
    font: 500 12px/1.4 var(--f-mono); color: var(--mute); }
  .turn svg { width: 30px; height: 30px; animation: turn 2.4s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
}

/* stage text */
#stage text { font-family: var(--f-body); fill: var(--ink); }
#stage .ttl { font: 700 44px var(--f-display); letter-spacing: -.02em; }
#stage .idx { font: 500 16px var(--f-mono); fill: var(--mute); }
#stage .prog { fill: var(--ink); }
#stage .bl { font-weight: 650; font-size: 22px; }
#stage .bs { font: 400 13px var(--f-mono); fill: var(--mute); }
#stage .bt { font: 500 12px var(--f-mono); fill: var(--mute); }
#stage .fl { font: 600 14px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; fill: var(--mute); }
#stage .cl { font-weight: 650; font-size: 18px; }
#stage .mono { font: 500 17px var(--f-mono); }
#stage .step { font: 600 18px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; fill: var(--mute); }
#stage .lane { font: 700 26px var(--f-display); }
#stage .lanes { font: 400 13px var(--f-mono); fill: var(--mute); }
#stage .hop { font: 400 14px var(--f-mono); fill: var(--mute); }
#stage .lab { font: 500 16px var(--f-mono); }
#stage .ms { font: 400 13px var(--f-mono); }
#stage .sl { font: 600 16px var(--f-mono); }
#stage .sv { font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
#stage .gl { font-weight: 650; font-size: 18px; }
#stage .gs { font: 400 13px var(--f-mono); fill: var(--mute); }
#stage .rule { font: 700 22px var(--f-mono); }
#stage .eq { font: 700 22px var(--f-mono); fill: var(--g); }
#stage .bigs { font-weight: 600; font-size: 22px; }
#stage .big { font: 700 46px var(--f-display); font-variant-numeric: tabular-nums; }
#stage .huge { font: 700 64px var(--f-display); letter-spacing: -.02em; }
#stage .warnl { font-weight: 650; font-size: 19px; fill: var(--r); }
#stage .warnbig { font: 700 80px var(--f-display); fill: var(--r); }
#stage .okl { font-weight: 650; font-size: 20px; fill: var(--g); }
#stage .good { fill: var(--g); }
#stage .warn, #stage .warnc { fill: var(--r); }
#stage .pt { font: 600 15px var(--f-mono); fill: var(--paper); }

/* boxes */
.bx > rect { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; transition: fill .18s, stroke .18s; }
.bx.frame > rect { fill: color-mix(in oklch, var(--ink) 4%, transparent); stroke: var(--line2); stroke-dasharray: 7 5; }
.bx.key > rect { fill: var(--ys); stroke-width: 2.6; }
.bx.frame.key > rect { fill: color-mix(in oklch, var(--y) 22%, transparent); stroke: var(--ink); stroke-dasharray: none; }
.bx.band > rect, .bx.side > rect { fill: color-mix(in oklch, var(--ink) 7%, transparent); }
.bx.chip > rect { stroke: var(--line2); rx: 6px; }
.bx.spare > rect { fill: none; stroke-dasharray: 5 5; }
.bx.spare .bl { fill: var(--mute); }
.bx.out > rect { fill: var(--paper); stroke: var(--mute); stroke-dasharray: 3 4; stroke-width: 2; }
.bx.store > rect { fill: var(--soft); stroke-width: 2.4; }
.bx.proc > rect { stroke: var(--b); stroke-width: 2.4; }
.bx.art > rect { stroke: var(--g); stroke-width: 2.4; }
.bx.btn > rect { rx: 10px; }
.bx.file .mono { font-size: 16px; }
.hot > rect { fill: var(--y) !important; }
.bx.frame.hot > rect { fill: color-mix(in oklch, var(--r) 12%, var(--soft)) !important; stroke: var(--r); stroke-dasharray: none; }
.bad > rect { stroke: var(--r) !important; stroke-width: 3 !important; fill: color-mix(in oklch, var(--r) 10%, var(--card)) !important; stroke-dasharray: none !important; }
.off > * { opacity: .25; }
.mini { fill: var(--card); stroke: var(--line); }
.slot rect { fill: var(--card); stroke: var(--line2); }
.slot.hot rect { fill: var(--y); }
.gate > rect { fill: var(--card); stroke: var(--ink); stroke-width: 1.4; }
.gate.hot > rect { fill: var(--y); }

/* lines and moving things */
.ln { fill: none; stroke-width: 2.4; stroke-linecap: round; }
.c-ink { stroke: var(--ink); } .c-b { stroke: var(--b); } .c-g { stroke: var(--g); }
.c-pu { stroke: var(--pu); } .c-wt { stroke: var(--wt); } .c-r { stroke: var(--r); }
.ln.dash { stroke-dasharray: 7 6; }
.ah-ink { fill: var(--ink); } .ah-b { fill: var(--b); } .ah-g { fill: var(--g); }
.ah-pu { fill: var(--pu); } .ah-wt { fill: var(--wt); } .ah-r { fill: var(--r); }
.f-ink { fill: var(--ink); } .f-b { fill: var(--b); } .f-g { fill: var(--g); }
.f-pu { fill: var(--pu); } .f-wt { fill: var(--wt); } .f-r { fill: var(--r); }
.pk.refused rect { fill: var(--r); }
.ck circle { fill: var(--card); stroke: var(--g); stroke-width: 2.4; }
.ck path { fill: none; stroke: var(--g); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ck.no circle, .ck.no path { stroke: var(--r); }
.boom path { stroke: var(--r); stroke-width: 3.5; stroke-linecap: round; }
.boom .bx-x { stroke-width: 5; }
.gear circle { fill: none; stroke: var(--ink); stroke-width: 2; }
.gear circle:first-child { stroke-width: 6; stroke-dasharray: 5 4; }
.snap { fill: var(--pu); }
.sandbox { fill: none; stroke: var(--g); stroke-width: 1.8; stroke-dasharray: 3 4; rx: 8px; }
.life { stroke: var(--line2); stroke-width: 1.4; stroke-dasharray: 4 5; }
.axis { stroke: var(--ink); stroke-width: 1.5; }
.run-ink, .run-g, .run-amb, .run-b { fill: none; stroke-width: 9; stroke-linecap: round; }
.run-ink { stroke: var(--ink); } .run-g { stroke: var(--g); } .run-amb { stroke: var(--wt); } .run-b { stroke: var(--b); }
.picked { stroke-width: 14; }
.odot { fill: var(--g); }
.no-ring { fill: none; stroke: var(--r); stroke-width: 3; stroke-dasharray: 4 3; }
.hl { fill: color-mix(in oklch, var(--r) 10%, transparent); stroke: var(--r); stroke-width: 1.5; stroke-dasharray: 5 4; }
.zig { fill: none; stroke: var(--r); stroke-width: 3; }
.jb { fill: var(--line2); } .jb.read { fill: var(--g); }
.candle rect { fill: var(--wt); } .wick { stroke: var(--wt); stroke-width: 2.5; }
.xline { stroke: var(--r); stroke-width: 2; stroke-dasharray: 5 4; }
.cursor { fill: var(--ink); stroke: var(--paper); stroke-width: 1.5; }
.lvl rect { stroke: var(--line); }
.lvl.ask rect { fill: color-mix(in oklch, var(--r) 9%, var(--card)); }
.lvl.bid rect { fill: color-mix(in oklch, var(--g) 9%, var(--card)); }
.lvl rect.eat { fill: var(--g); opacity: .35; stroke: none; }
.limit { stroke: var(--r); stroke-width: 2; stroke-dasharray: 6 4; }
.sdot { fill: var(--b); }
.memf { fill: var(--b); } .memb { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.fadeout { opacity: .1; transition: opacity .25s; }
.shake { animation: shake .4s linear; }

<body>
<svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="Animated explainer of the Linck platform">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-ink" d="M0 0L10 5L0 10z"/></marker><marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-b" d="M0 0L10 5L0 10z"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-g" d="M0 0L10 5L0 10z"/></marker><marker id="ah-pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-pu" d="M0 0L10 5L0 10z"/></marker><marker id="ah-wt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-wt" d="M0 0L10 5L0 10z"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse" markerUnits="strokeWidth"><path class="ah-r" d="M0 0L10 5L0 10z"/></marker></defs>

<script>
// Linck, visually: a tiny SVG animation engine. Each scene builds its
// elements once and returns update(t), called every frame with seconds.
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('stage');
const root = document.getElementById('layer');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const k = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const ke = (t, a, b) => ease(k(t, a, b));
const lerp = (a, b, f) => a + (b - a) * f;

function E(tag, a = {}, p = root) {
  const e = document.createElementNS(NS, tag);
  for (const n in a) e.setAttribute(n, a[n]);
  p.appendChild(e);
  return e;
}
function T(p, x, y, s, cls = 'lb', anchor = 'middle') {
  const e = E('text', { x, y, class: cls, 'text-anchor': anchor }, p);
  e.textContent = s;
  return e;
}
function G(p = root, cls = '') { return E('g', cls ? { class: cls } : {}, p); }
function op(el, v) { el.setAttribute('opacity', v.toFixed(3)); }
function tr(el, x, y, s = 1) { el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})${s !== 1 ? ` scale(${s.toFixed(3)})` : ''}`); }

// A box: label centred (or at the top), optional sub line and corner tag.
function box(p, x, y, w, h, label, o = {}) {
  const g = G(p, 'bx ' + (o.cls || ''));
  E('rect', { x, y, width: w, height: h, rx: o.rx || 0 }, g);
  let ly = o.top ? y + 32 : (o.sub ? y + h / 2 - 3 : y + h / 2 + 8);
  if (label) T(g, x + w / 2, ly, label, o.lcls || 'bl');
  if (o.sub) T(g, x + w / 2, ly + 24, o.sub, 'bs');
  if (o.tag) T(g, x + w - 10, y + 20, o.tag, 'bt', 'end');
  Object.assign(g, { X: x, Y: y, W: w, H: h, cx: x + w / 2, cy: y + h / 2, R: x + w, B: y + h });
  op(g, 0);
  return g;
}
// A line with an arrowhead in its colour.
function line(p, d, color = 'ink', o = {}) {
  const a = { d, class: `ln c-${color}${o.dash ? ' dash' : ''}` };
  if (o.arrow !== false) a['marker-end'] = `url(#ah-${color})`;
  const e = E('path', a, p);
  op(e, 0);
  return e;
}
function reveal(path, t, a, b) {             // draw a line from start to end
  const L = path.getTotalLength();
  const f = k(t, a, b);
  path.style.strokeDasharray = path.classList.contains('dash') ? '' : `${L} ${L}`;
  if (!path.classList.contains('dash')) path.style.strokeDashoffset = `${L * (1 - f)}`;
  op(path, f > 0 ? 1 : 0);
}
function dot(p, color, r = 7) { const e = E('circle', { r, cx: 0, cy: 0, class: 'dt f-' + color }, p); op(e, 0); return e; }
function packet(p, label, color, o = {}) {
  const g = G(p, 'pk');
  const w = Math.max(o.w || 0, 44, label.length * 10.8 + 24);
  E('rect', { x: -w / 2, y: -16, width: w, height: 32, rx: 4, class: 'f-' + color }, g);
  T(g, 0, 5, label, 'pt');
  op(g, 0);
  return g;
}
function placeOn(el, path, f) {
  const L = path.getTotalLength();
  const pt = path.getPointAtLength(clamp(f) * L);
  tr(el, pt.x, pt.y);
}
function travel(el, path, t, a, b, keep = false) {   // move along a path between a and b
  if (t < a || (t > b && !keep)) { op(el, 0); return false; }
  op(el, 1);
  placeOn(el, path, ease(k(t, a, b)));
  return true;
}
function chain(el, paths, t, t0, seg) {               // along several paths, one after another
  for (let i = 0; i < paths.length; i++) {
    const a = t0 + i * seg;
    if (t >= a && t <= a + seg) { op(el, 1); placeOn(el, paths[i], ease(k(t, a, a + seg))); return i; }
  }
  op(el, 0);
  return -1;
}
function stream(p, path, color, n, period, r = 6) {  // n dots looping along a path
  const ds = Array.from({ length: n }, () => dot(p, color, r));
  return (t, t0, t1 = 1e9) => ds.forEach((d, i) => {
    if (t < t0 || t > t1) { op(d, 0); return; }
    const f = (((t - t0) / period) + i / n) % 1;
    op(d, Math.min(1, (t - t0) * 2) * (f < 0.06 ? f / 0.06 : f > 0.94 ? (1 - f) / 0.06 : 1));
    placeOn(d, path, f);
  });
}
function fade(el, t, a, d = 0.45, out = null) {
  let o = k(t, a, a + d);
  if (out != null) o = Math.min(o, 1 - k(t, out, out + d));
  op(el, o);
}
function flash(el, t, a, d = 0.6) {                   // brief highlight class
  el.classList.toggle('hot', t >= a && t <= a + d);
}
function txt(el, s) { if (el.textContent !== s) el.textContent = s; }
function check(p, x, y, ok = true) {
  const g = G(p, ok ? 'ck ok' : 'ck no');
  E('circle', { cx: x, cy: y, r: 13 }, g);
  E('path', { d: ok ? `M${x - 6} ${y}l4 4 8-9` : `M${x - 5} ${y - 5}l10 10M${x + 5} ${y - 5}l-10 10` }, g);
  op(g, 0);
  return g;
}
function boom(p, x, y) {
  const g = G(p, 'boom');
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    E('path', { d: `M${x + Math.cos(a) * 14} ${y + Math.sin(a) * 14}L${x + Math.cos(a) * 34} ${y + Math.sin(a) * 34}` }, g);
  }
  E('path', { d: `M${x - 11} ${y - 11}l22 22M${x + 11} ${y - 11}l-22 22`, class: 'bx-x' }, g);
  op(g, 0);
  return g;
}
function gear(p, x, y, r = 18) {
  const g = G(p, 'gear');
  E('circle', { cx: 0, cy: 0, r }, g);
  E('circle', { cx: 0, cy: 0, r: r * 0.4 }, g);
  tr(g, x, y);
  g._x = x; g._y = y;
  return g;
}
function spin(g, t, speed = 120) { g.setAttribute('transform', `translate(${g._x},${g._y}) rotate(${(t * speed) % 360})`); }
function diamond(p, x, y, s = 10) { const e = E('path', { d: `M${x} ${y - s}l${s} ${s}-${s} ${s}-${s}-${s}z`, class: 'snap' }, p); op(e, 0); return e; }
function fmt(n) { return n.toLocaleString('en-IN'); }

// ── the player ──────────────────────────────────────────────────────────
const SCENES = [];
function scene(title, dur, build) { SCENES.push({ title, dur, build }); }
let cur = 0, start = 0, paused = false, pausedAt = 0, update = null;
const params = new URLSearchParams(location.search);
const RECORD = params.has('record');
const ONLY = params.has('scene') ? +params.get('scene') - 1 : null;
const AT = params.has('t') ? +params.get('t') : null;        // freeze at a time (screenshots)
const STILL = !RECORD && matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(i) {
  cur = (i + SCENES.length) % SCENES.length;
  root.innerHTML = '';
  const s = SCENES[cur];
  const head = G(root, 'head');
  T(head, 60, 70, s.title, 'ttl', 'start');
  T(head, 1540, 70, `${cur + 1} / ${SCENES.length}`, 'idx', 'end');
  const prog = E('rect', { x: 0, y: 893, width: 0, height: 7, class: 'prog' }, root);
  const body = G(root);
  const u = s.build(body);
  update = t => { u(t); prog.setAttribute('width', (1600 * clamp(t / s.dur)).toFixed(1)); };
  start = performance.now();
  pausedAt = 0;
  if (STILL) { paused = true; pausedAt = s.dur; }   // reduced motion: show the finished picture
  document.querySelectorAll('.dots button').forEach((b, j) => b.classList.toggle('on', j === cur));
  // the scene number in the address, where allowed: viewers that show the
  // page in a sandboxed srcdoc iframe (claude.ai artifacts) refuse it
  if (!RECORD) try { history.replaceState(null, '', `#${cur + 1}`); } catch (e) { /* no address to update */ }
  window.__sceneDone = false;
}
function frame(now) {
  if (update) {
    const t = AT != null ? AT : paused ? pausedAt : (now - start) / 1000;
    update(t);
    if (AT != null) { window.__sceneDone = true; requestAnimationFrame(frame); return; }
    if (!paused && t > SCENES[cur].dur + 0.6) {
      if (RECORD) { window.__sceneDone = true; if (ONLY == null && cur < SCENES.length - 1) load(cur + 1); else update = null; }
      else load(cur + 1);
    }
  }
  requestAnimationFrame(frame);
}
function togglePause() {
  if (paused) { start = performance.now() - pausedAt * 1000; paused = false; }
  else { pausedAt = (performance.now() - start) / 1000; paused = true; }
  document.getElementById('pp').textContent = paused ? '▶' : '❚❚';
}
window.addEventListener('DOMContentLoaded', () => {
  const dots = document.querySelector('.dots');
  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.title = `${i + 1}. ${s.title}`;
    b.setAttribute('aria-label', b.title);
    b.onclick = () => load(i);
    dots.appendChild(b);
  });
  document.getElementById('prev').onclick = () => load(cur - 1);
  document.getElementById('next').onclick = () => load(cur + 1);
  document.getElementById('pp').onclick = togglePause;
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') load(cur + 1);
    else if (e.key === 'ArrowLeft') load(cur - 1);
    else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  });
  if (RECORD) document.body.classList.add('record');
  const h = parseInt(location.hash.slice(1), 10);
  load(ONLY != null ? ONLY : (h >= 1 && h <= SCENES.length ? h - 1 : 0));
  requestAnimationFrame(frame);
});

// Scenes 1–6: the whole platform, why it is split, a tick, a slow
// strategy, building code, and every language running inside a host.

// 1 ─────────────────────────────────────────────────────────────────────
scene('Linck in one picture', 17, p => {
  const L = G(p), B = G(p), M = G(p);
  const phone = box(B, 60, 170, 200, 90, 'Phone', { sub: 'Desk · alerts' });
  const laptop = box(B, 60, 300, 200, 90, 'Laptop', { sub: 'review · repair' });
  const code = box(B, 60, 430, 200, 90, 'Your code', { sub: 'SDK · CLI' });
  const edge = box(B, 320, 150, 150, 390, 'Edge', { cls: 'band', top: true, sub: 'HTTPS' });
  const live = box(B, 540, 170, 230, 90, 'Live gateway', { sub: 'latest P&L' });
  const api = box(B, 540, 300, 230, 90, 'Product API', { sub: 'pages · reports' });
  const ctl = box(B, 540, 430, 230, 90, 'Control', { sub: 'deploy · schedule' });
  const cell = box(B, 840, 130, 560, 520, 'Cell', { cls: 'frame', top: true, lcls: 'fl' });
  const sup = box(B, 870, 180, 240, 300, 'Supervisor', { top: true, cls: 'key' });
  const chips = ['Python', 'Go', 'Rust', 'TypeScript'].map((l, i) => box(B, 890, 230 + i * 60, 200, 48, l, { lcls: 'cl', cls: 'chip' }));
  const md = box(B, 1140, 180, 230, 80, 'Market data', { sub: 'every price once' });
  const cache = box(B, 1140, 300, 230, 80, 'Tick cache', { sub: 'latest per instrument' });
  const oms = box(B, 870, 520, 240, 100, 'Orders & risk', { sub: 'only writer of money', cls: 'key' });
  const bgw = box(B, 1140, 520, 230, 100, 'Broker gateway', { sub: 'one per broker' });
  const exch = box(B, 1440, 180, 140, 80, 'Exchange', { cls: 'out' });
  const brk = box(B, 1440, 520, 140, 100, 'Brokers', { sub: 'Kite · Dhan…', cls: 'out' });
  const ledger = box(B, 870, 700, 240, 70, 'Ledger', { cls: 'store' });
  const journal = box(B, 540, 700, 230, 70, 'Journal', { cls: 'store', sub: 'every batch' });
  const nodes = [phone, laptop, code, edge, live, api, ctl, cell, sup, ...chips, md, cache, oms, bgw, exch, brk, ledger, journal];
  const pTick1 = line(L, 'M1440 220H1374', 'b'), pTick2 = line(L, 'M1255 260V296', 'b'), pTick3 = line(L, 'M1140 340H1114', 'b');
  const pOrd1 = line(L, 'M990 480V516', 'g'), pOrd2 = line(L, 'M1110 560H1136', 'g'), pOrd3 = line(L, 'M1370 560H1436', 'g');
  const pFill1 = line(L, 'M1440 600H1374', 'g'), pFill2 = line(L, 'M1140 600H1114', 'g');
  const pLive = line(L, 'M870 600H812V215H774', 'g'), pPhone = line(L, 'M540 215H264', 'g');
  const pReq = line(L, 'M260 345H536', 'ink'), pDep = line(L, 'M260 475H536', 'pu'), pDep2 = line(L, 'M770 455H866', 'pu');
  const pLed = line(L, 'M990 620V696', 'g', { dash: true }), pJou = line(L, 'M870 300H830V735H774', 'pu', { dash: true });
  const lines = [pTick1, pTick2, pTick3, pOrd1, pOrd2, pOrd3, pFill1, pFill2, pLive, pPhone, pReq, pDep, pDep2, pLed, pJou];
  const ticks = [stream(M, pTick1, 'b', 3, 0.9), stream(M, pTick2, 'b', 2, 0.6), stream(M, pTick3, 'b', 2, 0.6)];
  const order = packet(M, 'SELL CE+PE', 'g');
  const fill = packet(M, 'fill', 'g');
  const pnl = packet(M, '+₹1,240', 'g');
  const dep = packet(M, 'deploy v7', 'pu');
  const newChip = box(B, 890, 470, 200, 0, '', {});
  const req = dot(M, 'ink');
  return t => {
    nodes.forEach((n, i) => fade(n, t, 0.2 + i * 0.12));
    lines.forEach((l, i) => reveal(l, t, 3.2 + i * 0.06, 4.0 + i * 0.06));
    ticks.forEach(s => s(t, 4.2));
    chain(order, [pOrd1, pOrd2, pOrd3], t, 6.0, 0.6);
    flash(oms, t, 6.5, 0.6); flash(ledger, t, 6.6, 0.8);
    chain(fill, [pFill1, pFill2], t, 8.2, 0.55);
    chain(pnl, [pLive, pPhone], t, 9.4, 0.9);
    flash(phone, t, 11.1, 1.2);
    travel(req, pReq, t, 11.5, 12.3);
    chain(dep, [pDep, pDep2], t, 12.6, 0.8);
    flash(sup, t, 14.2, 1.0);
    chips.forEach((c, i) => flash(c, t, 14.4 + i * 0.15, 0.4));
    op(newChip, 0);
  };
});

// 2 ─────────────────────────────────────────────────────────────────────
scene('Why it is split up', 16, p => {
  const A = G(p), Bz = G(p), C = G(p);
  // Today: one process
  const s1 = T(A, 800, 150, 'Today', 'step');
  const one = box(A, 300, 190, 1000, 470, 'One Python process', { top: true, cls: 'frame', lcls: 'fl' });
  const web = box(A, 340, 260, 280, 90, 'Website');
  const feed = box(A, 660, 260, 280, 90, 'Kite feed');
  const money = box(A, 980, 260, 280, 90, 'Writes money');
  const strat = Array.from({ length: 8 }, (_, i) => box(A, 340 + i * 115, 420, 100, 90, 'S' + (i + 1), { cls: 'chip', lcls: 'cl' }));
  const dep1 = packet(A, 'deploy', 'pu');
  const pD1 = line(A, 'M60 300H296', 'pu');
  const rs1 = G(A, 'restart'); T(rs1, 800, 610, '⟳ everything restarts', 'warnl'); op(rs1, 0);
  // First build: split
  const s2 = T(Bz, 800, 150, 'First build', 'step');
  const core = box(Bz, 120, 230, 300, 120, 'Core API', { sub: 'website · reports' });
  const run = box(Bz, 480, 230, 300, 300, 'Runner workers', { top: true, cls: 'frame', lcls: 'fl' });
  const rchips = Array.from({ length: 8 }, (_, i) => box(Bz, 505 + (i % 2) * 135, 290 + Math.floor(i / 2) * 55, 120, 44, 'S' + (i + 1), { cls: 'chip', lcls: 'cl' }));
  const mdat = box(Bz, 840, 230, 300, 120, 'Market data', { sub: 'Go' });
  const omsB = box(Bz, 1200, 230, 300, 120, 'Orders & risk', { sub: 'Go · only writer of money', cls: 'key' });
  const pT = line(Bz, 'M840 300H784', 'b'), pO = line(Bz, 'M784 470H1350V354', 'g');
  const tk = stream(Bz, pT, 'b', 3, 0.7);
  const dep2 = packet(Bz, 'deploy', 'pu');
  const pD2 = line(Bz, 'M270 600V354', 'pu');
  const rs2 = G(Bz, 'restart'); T(rs2, 270, 440, '⟳', 'warnbig'); op(rs2, 0);
  const keep = G(Bz); T(keep, 630, 580, 'keeps trading ✓', 'okl'); op(keep, 0);
  // Final: cells
  const s3 = T(C, 800, 150, 'Final', 'step');
  const plat = box(C, 160, 190, 1280, 80, 'Platform: identity · control · product API · live gateway', { cls: 'band' });
  const cells = Array.from({ length: 10 }, (_, i) => {
    const x = 160 + (i % 5) * 260, y = 320 + Math.floor(i / 5) * 230;
    const g = box(C, x, y, 240, 200, 'Cell ' + (i + 1), { top: true, cls: 'frame', lcls: 'cl' });
    ['runtime', 'orders', 'market'].forEach((l, j) => {
      const r = E('rect', { x: x + 20, y: y + 55 + j * 44, width: 200, height: 34, class: 'mini' }, g);
      T(g, x + 120, y + 78 + j * 44, l, 'ms');
    });
    return g;
  });
  return t => {
    const a = 1 - k(t, 5.2, 5.7), b = Math.min(k(t, 5.7, 6.2), 1 - k(t, 10.6, 11.1)), c = k(t, 11.1, 11.6);
    op(A, a); op(Bz, b); op(C, c);
    [s1, one, web, feed, money].forEach((n, i) => fade(n, t, 0.2 + i * 0.2));
    strat.forEach((n, i) => fade(n, t, 1.2 + i * 0.08));
    reveal(pD1, t, 2.0, 2.4);
    travel(dep1, pD1, t, 2.2, 3.0);
    const hit = t > 3.0 && t < 4.6;
    one.classList.toggle('hot', hit);
    strat.forEach(s => s.classList.toggle('off', hit));
    [web, feed, money].forEach(s => s.classList.toggle('off', hit));
    fade(rs1, t, 3.0, 0.3, 4.6);
    [s2, core, run, mdat, omsB].forEach((n, i) => fade(n, t, 5.8 + i * 0.15));
    rchips.forEach((n, i) => fade(n, t, 6.4 + i * 0.05));
    reveal(pT, t, 6.6, 6.9); reveal(pO, t, 6.7, 7.1);
    tk(t, 6.9);
    reveal(pD2, t, 7.6, 7.9);
    travel(dep2, pD2, t, 7.8, 8.5);
    const hit2 = t > 8.5 && t < 9.8;
    core.classList.toggle('off', hit2); fade(rs2, t, 8.5, 0.2, 9.8);
    fade(keep, t, 8.7, 0.3);
    rchips.forEach((c2, i) => flash(c2, t, 8.6 + i * 0.1, 0.25));
    [s3, plat].forEach((n, i) => fade(n, t, 11.2 + i * 0.2));
    cells.forEach((n, i) => fade(n, t, 11.6 + i * 0.18));
    const bad = t > 14.2 && t < 15.6;
    cells[6].classList.toggle('bad', bad);
  };
});

// 3 ─────────────────────────────────────────────────────────────────────
scene('A price, from exchange to strategy', 15, p => {
  const L = G(p), B = G(p), M = G(p);
  const ex = box(B, 40, 300, 200, 110, 'Exchange', { cls: 'out' });
  const fh = box(B, 290, 300, 200, 110, 'Feed handler', { sub: 'decode · clean' });
  const sq = box(B, 540, 300, 200, 110, 'Sequencer', { sub: 'numbers it' });
  const cache = box(B, 790, 230, 300, 330, 'Tick cache', { top: true, sub: '', cls: 'frame', lcls: 'fl' });
  const names = ['NIFTY', 'BANKNIFTY', 'SENSEX', 'BANKEX'];
  const vals = [25184.3, 55920.15, 82410.9, 61879.06];
  const slots = names.map((n, i) => {
    const g = G(B, 'slot');
    E('rect', { x: 810, y: 290 + i * 62, width: 260, height: 50 }, g);
    T(g, 826, 321 + i * 62, n, 'sl', 'start');
    g._v = T(g, 1054, 321 + i * 62, fmt(vals[i]), 'sv', 'end');
    op(g, 0);

  const pOut = [...ads, dhan].map((a, i) => line(L, `M1100 ${a.cy}H1226`, 'g'));
  const pkt = [0, 1, 2, 3].map(() => packet(M, 'order', 'g', { w: 70 }));
  const x = boom(B, 1110, 590);
  const rs = T(B, 730, 830, '', 'warnl');
  return t => {
    [oms, pod, core].forEach((n, i) => fade(n, t, 0.2 + i * 0.2));
    duties.forEach((d, i) => fade(d, t, 0.9 + i * 0.15));
    fade(inproc, t, 1.6); ads.forEach((d, i) => fade(d, t, 1.8 + i * 0.15));
    fade(side, t, 2.4); fade(dhan, t, 2.6); fade(sockLab, t, 2.8);
    brokers.forEach((b, i) => fade(b, t, 3.0 + i * 0.1));
    [pIn, ...pA, pS, ...pOut].forEach((l, i) => reveal(l, t, 3.4 + i * 0.05, 3.8 + i * 0.05));
    pkt.forEach((pk, i) => {
      const a = 4.4 + i * 0.9;
      const paths = i < 3 ? [pIn, pA[i], pOut[i]] : [pIn, pS, pOut[3]];
      chain(pk, paths, t, a, 0.5);
    });
    duties.forEach((d, i) => flash(d, t, 4.6 + i * 0.9, 0.4));
    // the sidecar dies and comes back
    const down = t > 9.6 && t < 11.6;
    fade(x, t, 9.6, 0.2, 11.4);
    side.classList.toggle('bad', down); dhan.classList.toggle('off', down);
    rs.setAttribute('class', t > 11.6 ? 'okl' : 'warnl');
    txt(rs, t > 11.6 ? 'restarted · asked the broker for every tagged order · reconciled ✓' : down ? 'sidecar down · Dhan pauses new entries, exits wait · others carry on' : '');
    if (t > 9.6 && t < 11.6) { [0, 1, 2].forEach(i => chain(pkt[i], [pIn, pA[i], pOut[i]], t, 9.8 + i * 0.5, 0.4)); }
    flash(duties[3], t, 11.8, 1.0);
    if (t > 13.0) chain(pkt[3], [pIn, pS, pOut[3]], t, 13.2, 0.5);
  };
});

// 15 ────────────────────────────────────────────────────────────────────
// Sizes from 07-brokers-latency-load.md: 20,000 strategies ≈ 4–6 hosts in 2
// cells (estimate, from 2–4 MB a strategy and the measured round trip).
scene('Room for thousands', 16, p => {
  const B = G(p);
  const host = box(B, 60, 150, 460, 520, 'One host', { top: true, cls: 'frame', lcls: 'fl', sub: '16 vCPU · 64 GB' });
  const dots = [];
  for (let i = 0; i < 350; i++) { const c = E('rect', { x: 90 + (i % 20) * 20, y: 230 + Math.floor(i / 20) * 20, width: 14, height: 14, class: 'sdot' }, B); op(c, 0); dots.push(c); }
  const memB = E('rect', { x: 90, y: 610, width: 400, height: 26, class: 'memb' }, B); op(memB, 0);
  const memF = E('rect', { x: 90, y: 610, width: 0, height: 26, class: 'memf' }, B);
  const cap = E('line', { x1: 330, y1: 600, x2: 330, y2: 646, class: 'xline' }, B); op(cap, 0);
  const capL = T(B, 336, 598, 'keep 40% free', 'gs', 'start'); op(capL, 0);
  const memL = T(B, 290, 700, '', 'bs');
  const ctr = T(B, 290, 790, '', 'huge');
  const cell = box(B, 600, 150, 300, 520, 'One cell', { top: true, cls: 'frame', lcls: 'fl' });
  const hosts = [0, 1, 2].map(i => box(B, 630, 210 + i * 150, 240, 120, 'host', { cls: 'chip', sub: '≈ 3,500' }));
  const cells = Array.from({ length: 10 }, (_, i) => box(B, 980 + (i % 2) * 290, 150 + Math.floor(i / 2) * 104, 270, 90, 'cell ' + (i + 1), { cls: i < 2 ? 'chip' : 'chip spare', sub: i < 2 ? '≈ 10,000' : 'add when needed' }));
  const per = T(B, 1260, 720, '', 'bs');
  return t => {
    fade(host, t, 0.2); op(memB, k(t, 0.6, 1.0)); fade(cap, t, 1.0); fade(capL, t, 1.2);
    const f = k(t, 1.0, 5.0);
    dots.forEach((d, i) => op(d, i < Math.floor(350 * f) ? 1 : 0));
    memF.setAttribute('width', (400 * f * 0.22).toFixed(1));
    txt(memL, t > 1 ? `memory ≈ ${Math.round(f * 14)} GB of 64 · est.` : '');
    const total = t < 6 ? Math.round(f * 3500) : t < 9.6 ? 3500 + Math.round(k(t, 6.6, 9) * 6500) : 10000 + Math.round(k(t, 10.2, 11) * 10000);
    txt(ctr, t > 1 ? fmt(Math.round(total / 50) * 50) + ' strategies' : '');
    fade(cell, t, 6.0); hosts.forEach((h, i) => fade(h, t, 6.4 + i * 0.5));
    cells.forEach((c, i) => fade(c, t, i < 2 ? 9.8 + i * 0.4 : 11.4 + i * 0.12));
    cells[1].classList.toggle('bad', t > 13.6 && t < 14.8);
    txt(per, 'a bad cell stays a bad cell; the rest trade on'); fade(per, t, 13.6);
  };
});

// 16 ────────────────────────────────────────────────────────────────────
scene('From a laptop to live money', 16, p => {
  const L = G(p), B = G(p), M = G(p);
  const stages = ['Write', 'Run a past day', 'Backtest', 'Certify', 'Paper', 'Shadow', 'Live · 1 lot', 'Watched'];
  const W = 176, gap = 18, x0 = 40, y = 330;
  const boxes = stages.map((s, i) => box(B, x0 + i * (W + gap), y, W, 110, s, { cls: i === 3 ? 'band' : i >= 6 ? 'key' : '' }));
  const pths = stages.slice(1).map((_, i) => line(L, `M${x0 + i * (W + gap) + W} ${y + 55}H${x0 + (i + 1) * (W + gap) - 4}`, 'ink'));
  const tok = packet(M, 'strategy v7', 'pu', { w: 120 });
  const certs = ['faults', 'same twice', 'budgets'].map((c, i) => { const g = G(B); g._c = check(g, x0 + 3 * (W + gap) + 30, y + 150 + i * 40); T(g, x0 + 3 * (W + gap) + 54, y + 155 + i * 40, c, 'gs', 'start'); op(g, 0); return g; });
  const card = box(B, x0 + 5 * (W + gap) - 80, y + 150, 256, 150, 'Ready for live', { top: true, cls: 'frame', lcls: 'cl', sub: '✓ ✓ ✓ ✓' });
  const pnl = packet(B, '+₹1,240 today', 'g', { w: 150 }); tr(pnl, x0 + 6 * (W + gap) + W / 2, y + 170);
  const watch = ['day check', 'issues', 'repair'].map((c, i) => { const e = T(B, x0 + 7 * (W + gap) + W / 2, y + 160 + i * 34, c, 'bs'); op(e, 0); return e; });
  const times = ['laptop', 'seconds', 'minutes', 'minutes', 'days', 'weeks', 'ongoing', 'every day'].map((s, i) => { const e = T(B, x0 + i * (W + gap) + W / 2, y - 18, s, 'hop'); op(e, 0); return e; });
  return t => {
    boxes.forEach((b, i) => fade(b, t, 0.2 + i * 0.15));
    times.forEach((e, i) => fade(e, t, 0.4 + i * 0.15));
    pths.forEach((l, i) => reveal(l, t, 1.4 + i * 0.08, 1.8 + i * 0.08));
    const at = [2.2, 3.4, 4.6, 5.8, 8.0, 9.4, 11.6, 13.6];
    let st = -1; at.forEach((a, i) => { if (t >= a) st = i; });
    if (st >= 0) {
      const from = boxes[st], to = boxes[Math.min(st + 1, 7)];
      const nxt = at[st + 1] || 99;
      const f = ke(t, nxt - 0.6, nxt);
      tr(tok, lerp(from.cx, to.cx, st < 7 ? f : 0), y - 62);
      op(tok, 1);
    } else op(tok, 0);
    boxes.forEach((b, i) => flash(b, t, at[i], 0.8));
    certs.forEach((c, i) => { fade(c, t, 6.2 + i * 0.4); fade(c._c, t, 6.3 + i * 0.4); });
    fade(card, t, 9.8);
    fade(pnl, t, 12.0);
    watch.forEach((e, i) => fade(e, t, 13.8 + i * 0.3));
  };
});
