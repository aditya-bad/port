<text x="40" y="1124" class="note" text-anchor="start">Ticks never go through NATS: md streams them to the runners over gRPC, keeping only the latest price. Every boundary already speaks its final contract, so each piece can later be swapped alone. Sizes are estimates.</text>
<text x="40" y="1146" class="note" text-anchor="start">No provider is assumed; every store is self-run or managed on the same protocol. “Any site” parts can run elsewhere from day one; Lens gets its own site when the product API leaves core-api.</text></svg>