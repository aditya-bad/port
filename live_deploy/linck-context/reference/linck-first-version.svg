<text x="40" y="52" class="title" text-anchor="start">Linck, first version</text>
<text x="40" y="82" class="subtitle" text-anchor="start">The intermediate architecture we build first: a home site you choose (any cloud or your own servers), one Kubernetes cluster, nine deployables of our own. Sized for ~2,000 strategies, ~5,000 instruments, ~20k updates/s at the open (estimates).</text>
