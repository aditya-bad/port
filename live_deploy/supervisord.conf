; live_deploy — supervisord config for running this as a background,
; production-style service on a machine you already have (see
; RUN_GUIDE.md's "Option 2 — Background/production" for the full
; writeup, including what a crash-restart does and does NOT do to a
; Kite session).
;
; Usage (from this directory):
;   pip install supervisor       # one-time — a dev/ops tool choice, not a runtime dependency (not in requirements.txt)
;   supervisord -c supervisord.conf
;   supervisorctl -c supervisord.conf status
;   supervisorctl -c supervisord.conf stop|start|restart live_deploy
;
; All paths below use supervisor's own %(here)s interpolation (this
; file's own directory) so this works unmodified regardless of where
; live_deploy/ is checked out — no hardcoded absolute paths to edit.
; Logs land in ./logs/ (created alongside this file — see logs/.gitkeep)
; rather than /var/log, on purpose, so this doesn't need root/sudo to
; run as-is; point stdout_logfile/stderr_logfile/logfile at /var/log/…
; instead for a more conventional system-wide install.

[unix_http_server]
file=%(here)s/logs/supervisor.sock

[supervisord]
logfile=%(here)s/logs/supervisord.log
pidfile=%(here)s/logs/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/logs/supervisor.sock

[program:live_deploy]
; run.py, not `python app/main.py` — see RUN_GUIDE.md's own opening
; section for exactly why that distinction matters.
command=python3 %(here)s/run.py
directory=%(here)s
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stdout_logfile=%(here)s/logs/stdout.log
stderr_logfile=%(here)s/logs/stderr.log
